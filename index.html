<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Sniper - Offline Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
            font-size: 20px;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 0, 0, 0.7);
        }
        #crosshair::before {
            top: 4px;
            left: -10px;
            width: 30px;
            height: 2px;
        }
        #crosshair::after {
            top: -10px;
            left: 4px;
            width: 2px;
            height: 30px;
        }
        #scope {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: 35vh solid rgba(0, 0, 0, 0.85);
            box-sizing: border-box;
            border-radius: 50%;
            display: none;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
    <!-- Three.js Library hosted via CDN (Cached locally after first load) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui">
        Targets Remaining: <span id="target-count">5</span>
    </div>
    <div id="crosshair"></div>
    <div id="scope"></div>
    <div id="instructions">
        <h1>GHOST SNIPER</h1>
        <p>Click anywhere to Start</p>
        <p><b>Controls:</b></p>
        <p>Mouse: Look Around</p>
        <p>Right Click (Hold/Toggle): Scope Zoom</p>
        <p>Left Click: Fire Sniper</p>
    </div>

    <script>
        let scene, camera, renderer;
        let targets = [];
        let isScoped = false;
        let targetsLeft = 5;

        const container = document.getElementById('game-container');
        const instructions = document.getElementById('instructions');
        const scope = document.getElementById('scope');
        const targetCountUI = document.getElementById('target-count');

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xdce6f2); // Sky color
            scene.fog = new THREE.Fog(0xdce6f2, 50, 300);

            // Camera Setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(100, 100, 50);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x666666));

            // Terrain / Ground
            const groundGeo = new THREE.PlaneGeometry(500, 500);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0xc2b280 }); // Desert sand color
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Spawn Targets (Enemies)
            spawnTargets();

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Controls & Events
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    instructions.style.display = 'none';
                } else {
                    instructions.style.display = 'block';
                }
            });

            document.addEventListener('mousemove', handleLook);
            document.addEventListener('mousedown', handleInput);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function spawnTargets() {
            for (let i = 0; i < targetsLeft; i++) {
                const targetGroup = new THREE.Group();

                // Target Body
                const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 2, 8);
                const bodyMat = new THREE.MeshLambertMaterial({ color: 0x224422 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1;
                targetGroup.add(body);

                // Target Head
                const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
                const headMat = new THREE.MeshLambertMaterial({ color: 0xcc9977 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 2.2;
                targetGroup.add(head);

                // Random position in front of player
                const distance = 40 + Math.random() * 60;
                const angle = (Math.random() - 0.5) * 1.2;
                targetGroup.position.x = Math.sin(angle) * distance;
                targetGroup.position.z = -Math.cos(angle) * distance;

                scene.add(targetGroup);
                targets.push(targetGroup);
            }
        }

        let yaw = 0, pitch = 0;
        function handleLook(e) {
            if (document.pointerLockElement !== document.body) return;

            const sensitivity = isScoped ? 0.0005 : 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;

            pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function handleInput(e) {
            if (document.pointerLockElement !== document.body) return;

            // Right Click - Toggle Scope
            if (e.button === 2) {
                isScoped = !isScoped;
                camera.fov = isScoped ? 15 : 60;
                camera.updateProjectionMatrix();
                scope.style.display = isScoped ? 'block' : 'none';
            }

            // Left Click - Shoot
            if (e.button === 0) {
                shoot();
            }
        }

        // Prevent context menu on right click
        document.addEventListener('contextmenu', e => e.preventDefault());

        function shoot() {
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            for (let i = 0; i < intersects.length; i++) {
                let hitObject = intersects[i].object;
                let parentGroup = hitObject.parent;

                if (targets.includes(parentGroup)) {
                    scene.remove(parentGroup);
                    targets = targets.filter(t => t !== parentGroup);
                    targetsLeft--;
                    targetCountUI.textContent = targetsLeft;

                    if (targetsLeft === 0) {
                        alert("MISSION COMPLETE! All targets eliminated.");
                        location.reload();
                    }
                    break;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
